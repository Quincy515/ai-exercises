[package]
name = "playground"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fasteval = "0.2.4"
reqwest = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
base64 = "0.22"
thiserror = { workspace = true }
async-openai = { workspace = true, features = [
    "chat-completion",
    "responses",
    "audio",
    "realtime",
] }
tokio-tungstenite = { version = "0.29", features = ["connect", "native-tls"] }
llm-tokenizer = "1.3.2"
axum = "0.8.9"
validator = { version = "0.20", features = ["derive"] }
schemars = "1.2.1"
derive-name = "1.1.0"
typeshift = "0.5.1"
rmcp = { workspace = true }
