services:
  sandbox_dev:
    # 开发环境使用独立 Dockerfile，生产镜像继续使用根目录 Dockerfile。
    build:
      context: ..
      dockerfile: .devops/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:-1.97}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    hostname: sandbox

    # SSH 后台运行，Rust API 作为容器主进程运行。
    command:
      - bash
      - -lc
      - |
        echo "sandbox:$${SSH_PASSWORD}" | chpasswd
        ssh-keygen -A
        /usr/sbin/sshd
        exec gosu sandbox cargo run --locked

    environment:
      SSH_PASSWORD: ${SSH_PASSWORD:-sandbox}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      SERVER_TIMEOUT_MINUTES: ${SERVER_TIMEOUT_MINUTES:-60}

    # 挂载源码，并持久化 Cargo 下载和编译缓存。
    volumes:
      - ..:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - cargo_target:/cargo-target

    # 端口只绑定本机，适合本地开发。
    ports:
      - "127.0.0.1:${SSH_PORT:-2222}:22"
      - "127.0.0.1:${SANDBOX_PORT:-3000}:3000"

    init: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/api-docs/openapi.json"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  cargo_registry:
  cargo_git:
  cargo_target:
