; Supervisor 只负责容器内长期进程的生命周期，业务 API 由 Rust Axum 实现。
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=ubuntu:ubuntu

[supervisord]
# nodaemon 模式已经输出到容器标准流，主日志文件关闭后可以避免重复日志。
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Rust Axum API。监听地址和端口来自 Dockerfile 或容器环境变量。
[program:app]
command=/usr/local/bin/sandbox
directory=/sandbox
user=ubuntu
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/ubuntu"
priority=60

; Xvfb 提供没有物理显示器时仍可使用的虚拟桌面。
[program:xvfb]
command=/bin/bash -lc 'rm -f /tmp/.X1-lock; exec Xvfb :1 -screen 0 1280x1080x24 -ac'
user=ubuntu
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; Chromium 使用独立临时配置目录，并只在容器内部开放原始调试端口 8222。
[program:chrome]
command=/bin/bash -lc 'exec chromium --display=:1 --window-size=1280,1080 --start-maximized --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --disable-extensions --disable-component-extensions-with-background-pages --no-first-run --no-default-browser-check --disable-notifications --user-data-dir=/tmp/chromium-profile --remote-debugging-address=127.0.0.1 --remote-debugging-port=8222 ${CHROME_ARGS}'
user=ubuntu
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=":1",HOME="/home/ubuntu"
priority=20

; socat 把 Chromium 的内部调试端口转换为容器能力端口 9222。
[program:socat]
command=socat TCP-LISTEN:9222,bind=0.0.0.0,fork,reuseaddr TCP:127.0.0.1:8222
user=ubuntu
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; x11vnc 把 Xvfb 的桌面转换为 VNC。端口应由沙箱调度层控制暴露范围。
[program:x11vnc]
command=x11vnc -display :1 -nopw -shared -listen 0.0.0.0 -xkb -forever -rfbport 5900
user=ubuntu
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=":1",HOME="/home/ubuntu"
priority=40

; websockify 把 VNC 转换为 WebSocket，供上层远程桌面客户端连接。
[program:websockify]
command=websockify 0.0.0.0:5901 127.0.0.1:5900
user=ubuntu
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=50

; 使用分组提供统一的 supervisorctl start/stop/restart 入口。
[group:services]
programs=xvfb,chrome,socat,x11vnc,websockify,app
