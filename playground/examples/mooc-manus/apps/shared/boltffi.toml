[package]
name = "shared"
crate = "shared"
version = "0.1.0"

[targets.wasm]
output = "../generated"
profile = "release"
# BoltFFI reads Cargo's target directory, including a custom target-dir.

[targets.wasm.typescript]
output = "../generated/pkg"
# Justfile supplies runtime_version from the workspace's exact Cargo dependency.

[targets.wasm.npm]
package_name = "shared"
