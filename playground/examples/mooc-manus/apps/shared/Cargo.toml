[package]
name = "shared"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "lib", "staticlib"]
name = "shared"

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
default = ["ffi"]
# Enable CoreFfi and the CruxShell callback for BoltFFI packages.
# Direct Rust consumers can disable this to omit the FFI exports and imports.
ffi = ["dep:boltffi"]
codegen = [
    "dep:anyhow",
    "dep:clap",
    "dep:log",
    "dep:pretty_env_logger",
    "facet_typegen",
]
facet_typegen = ["crux_core/facet_typegen"]

[dependencies]
boltffi = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
clap = { version = "4.6.6", optional = true, features = ["derive"] }
log = { version = "0.4", optional = true }
pretty_env_logger = { version = "0.5", optional = true }
crux_core.workspace = true
crux_http.workspace = true
crux_kv.workspace = true
crux_platform.workspace = true
crux_time.workspace = true

async-sse = "5"
async-std = "1"
futures = "0.3"
tracing = "0.1"
serde_json = "1.0"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
facet = { version = "=0.46.5", features = ["chrono"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }
crux_core = { workspace = true, features = ["testing"] }
