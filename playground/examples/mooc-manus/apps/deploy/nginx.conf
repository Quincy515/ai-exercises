# noVNC 通过 Upgrade 切换到 WebSocket；普通 API 继续使用 HTTP。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTPS 由外层反向代理处理，保留其传来的协议供后端使用。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index _shell.html;

    # 与后端文件上传接口的 32 MiB 请求体上限一致。
    client_max_body_size 32m;

    location /api/ {
        # 保留 /api 前缀，交给 Loco 路由处理。
        proxy_pass http://api:5150;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Agent 逐事件推送立即交付；长任务和远程桌面允许持续保持连接。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源缺失返回 404，避免把 HTML 当成 JavaScript/WASM 加载。
    location /assets/ {
        try_files $uri =404;
    }

    # TanStack SPA 深链接统一回到构建生成的页面壳。
    location / {
        try_files $uri $uri/ /_shell.html;
    }
}
