[package]
name = "mcp-server-demo"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
fasteval = "0.2.4"
axum = "0.8.9"
