[package]
name = "a2a-demo"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-server = { package = "a2a-server-lf", version = "0.4.1" }
async-openai = { version = "0.41.1", default-features = false, features = ["byot", "chat-completion", "rustls"] }
axum = "0.8"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
