[package]
name = "a2a-demo"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "a2a-demo"
path = "src/main.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[[bin]]
name = "reqwest-a2a"
path = "src/reqwest_a2a.rs"

[dependencies]
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-client = { package = "a2a-client-lf", version = "0.2.1", features = ["rustls-tls"], default-features = false }
a2a-server = { package = "a2a-server-lf", version = "0.4.1", features = ["rustls-tls"], default-features = false }
async-openai = { version = "0.41.1", default-features = false, features = ["byot", "chat-completion", "rustls"] }
reqwest = { version = "0.13", features = ["rustls"] }
axum = "0.8"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
